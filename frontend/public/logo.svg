<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="mlr-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="50%" stop-color="#1a2b4c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mlr-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="mlr-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="mlr-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="mlr-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <filter id="mlr-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.32"/>
    </filter>
  </defs>

  <!-- Container Squircle Badge -->
  <rect x="4" y="4" width="112" height="112" rx="30" fill="url(#mlr-bg)" filter="url(#mlr-glow)"/>
  <rect x="5.5" y="5.5" width="109" height="109" rx="28.5" fill="none" stroke="rgba(255,255,255,0.14)" stroke-width="1.5"/>

  <!-- Left Cloche Arch of "M" -->
  <path d="M27 76 C27 48, 43 40, 60 54" fill="none" stroke="url(#mlr-blue)" stroke-width="9.5" stroke-linecap="round"/>

  <!-- Right Cloche Arch of "M" -->
  <path d="M60 54 C77 40, 93 48, 93 76" fill="none" stroke="url(#mlr-green)" stroke-width="9.5" stroke-linecap="round"/>

  <!-- Center Pillar of "M" -->
  <path d="M60 54 L60 38" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>

  <!-- Sleek Plate Base Curve -->
  <path d="M23 82 C38 92, 82 92, 97 82" fill="none" stroke="#f8fafc" stroke-width="7" stroke-linecap="round"/>

  <!-- Zero-Waste Sprout / Leaf at Crown -->
  <path d="M60 37 C60 22, 75 19, 76 19 C76 34, 62 37, 60 37 Z" fill="url(#mlr-leaf)"/>

  <!-- Signature Mealers Crimson Reservation Dot -->
  <circle cx="88" cy="78" r="6.5" fill="url(#mlr-red)"/>
  <circle cx="88" cy="78" r="2.5" fill="#ffffff" fill-opacity="0.5"/>
</svg>

