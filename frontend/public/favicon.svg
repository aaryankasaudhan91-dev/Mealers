<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14213d"/>
      <stop offset="100%" stop-color="#1e3258"/>
    </linearGradient>
    <linearGradient id="bowl" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2457d6"/>
      <stop offset="100%" stop-color="#16734a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" filter="url(#glow)"/>
  
  <!-- Steam / coordination lines -->
  <path d="M24 16 Q26 12 28 16 T32 16" fill="none" stroke="#f2c94c" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M34 14 Q36 10 38 14 T42 14" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Mealers cloche / bowl -->
  <path d="M14 34 Q32 20 50 34 Z" fill="url(#bowl)"/>
  <!-- Rim -->
  <rect x="12" y="34" width="40" height="4" rx="2" fill="#ffffff"/>
  <!-- Bowl base -->
  <path d="M16 38 Q18 50 32 50 Q46 50 48 38 Z" fill="#ffffff" fill-opacity="0.9"/>
  
  <!-- Signature Mealers Red Dot -->
  <circle cx="49" cy="48" r="4.5" fill="#c63c36"/>
</svg>
