<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f8f7f3">

  <!-- SEO & Primary Meta -->
  <title>Mealers — Planned Campus Meals & Zero-Waste Dining</title>
  <meta name="description" content="Mealers coordinates campus dining by connecting student meal reservations directly to kitchen prep before cooking begins. Browse menus, filter by allergens, and reduce food waste.">
  <meta name="author" content="Mealers">
  <link rel="canonical" href="https://mealers.vercel.app/">

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://mealers.vercel.app/">
  <meta property="og:title" content="Mealers — Planned Campus Meals & Zero-Waste Dining">
  <meta property="og:description" content="Browse campus menus, reserve portions in advance, and eliminate cafeteria food waste with Mealers.">
  <meta property="og:image" content="/social-preview.svg">
  <meta property="og:site_name" content="Mealers">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:url" content="https://mealers.vercel.app/">
  <meta name="twitter:title" content="Mealers — Planned Campus Meals">
  <meta name="twitter:description" content="Browse campus menus, reserve portions in advance, and eliminate cafeteria food waste.">
  <meta name="twitter:image" content="/social-preview.svg">

  <!-- Favicons & Touch Icons -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/favicon.svg">

  <!-- Performance & Preloads -->
  <link rel="preload" href="/styles.css" as="style">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <div id="cookie-banner" role="region" aria-label="Cookie and privacy settings" class="cookie-banner hidden"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
  <script type="module" src="/app.js"></script>
</body>
</html>
