services:
  - type: web
    name: mealers-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: MONGODB_DATABASE
        value: mealers_demo
      - key: FRONTEND_ORIGIN
        sync: false
      - key: MONGODB_URI
        sync: false

  - type: web
    name: mealers-frontend
    runtime: node
    plan: free
    rootDir: frontend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false

