name: Mealers CI / CD Pipeline

on:
  push:
    branches: [ main, master, V1 ]
  pull_request:
    branches: [ main, master, V1 ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, Check & Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [ 20.x, 22.x ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Workspace Dependencies
        run: |
          npm install
          npm --prefix backend install
          npm --prefix frontend install

      - name: Run Code Quality & Syntax Checks
        run: npm run check

      - name: Start isolated replica set
        run: |
          docker run -d --name mealers-test-db -p 27017:27017 mongo:7.0 --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do docker exec mealers-test-db mongosh --quiet --eval 'db.runCommand({ping:1})' && break || sleep 2; done
          docker exec mealers-test-db mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do docker exec mealers-test-db mongosh --quiet --eval 'if(!db.hello().isWritablePrimary)quit(1)' && break || sleep 2; done

      - name: Run database integration and security tests
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/mealers_ci?replicaSet=rs0&directConnection=true
          NO_MEMORY_SERVER: 'true'
        run: npm test

      - name: Verify Workspace Build
        run: npm run build

  deploy-readiness:
    name: Verify Vercel & Render Deployment Readiness
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Cloud Configurations & Assets
        run: |
          test -f vercel.json || (echo "Missing vercel.json" && exit 1)
          test -f render.yaml || (echo "Missing render.yaml" && exit 1)
          test -f frontend/public/favicon.svg || (echo "Missing favicon.svg" && exit 1)
          test -f frontend/public/favicon.ico || (echo "Missing favicon.ico" && exit 1)
          test -f frontend/public/logo.svg || (echo "Missing logo.svg" && exit 1)
          test -f frontend/public/social-preview.svg || (echo "Missing social-preview.svg" && exit 1)
          test -f frontend/public/robots.txt || (echo "Missing robots.txt" && exit 1)
          test -f frontend/public/sitemap.xml || (echo "Missing sitemap.xml" && exit 1)
          test -f frontend/public/404.html || (echo "Missing 404.html" && exit 1)
          echo "All Vercel & Render cloud deployment assets verified successfully."

